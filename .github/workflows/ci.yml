name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lists-and-tools:
    name: Lists, tools and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Tools virtualenv
        run: |
          python3 -m venv tools/venv
          tools/venv/bin/pip install -q -r tools/requirements.txt
      - name: Example lists, README tables, shell helpers
        env:
          CLEANYOURTV_STRICT: ${{ github.event_name == 'push' && '1' || '' }}
        # The venv interpreter, not the runner's python3: the runner has no adb_shell, so
        # running the suite with it leaves test_tv_reboot to its child-rerun workaround
        # instead of running in-process (#1800).
        run: tools/venv/bin/python -m unittest discover -s tests -v

  tables:
    # Main only: a list PR adds just its folder and tv.json, so on a pull request the tables lag on purpose.
    # A job of its own, so "the tables want regenerating" never reads as "the lists are broken": the merge
    # bot waits for main to be green between merges and regenerates the tables after the wave.
    name: README tables
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: README TV tables match examples/*/tv.json
        run: |
          python3 tools/gen_tables.py --check || {
            echo "::error::README.md and examples/README.md are generated from examples/*/tv.json. A maintainer runs python3 tools/gen_tables.py on main and commits the result; contributors never need to."
            exit 1
          }

  launcher:
    name: Launcher build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Unit tests, lint and release build
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: The launcher stays small
        run: |
          size=$(stat -c %s launcher/app/build/outputs/apk/release/app-release.apk)
          echo "release APK: $((size / 1024)) KB"
          test "$size" -lt 589824 || { echo "APK is over 576 KB; the launcher targets 1 GB TVs, keep it small"; exit 1; }

  personal-signed-build:
    name: Personal signed build (tvle369 only, manual)
    if: >
      github.repository == 'tvle369/cleanyourtv' &&
      github.ref == 'refs/heads/personal-launcher-build' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Confirm all four signing secrets are present (values never printed)
        env:
          CYT_KEYSTORE_B64: ${{ secrets.CYT_KEYSTORE_B64 }}
          CYT_KEYSTORE_PASSWORD: ${{ secrets.CYT_KEYSTORE_PASSWORD }}
          CYT_KEY_ALIAS: ${{ secrets.CYT_KEY_ALIAS }}
          CYT_KEY_PASSWORD: ${{ secrets.CYT_KEY_PASSWORD }}
        run: |
          missing=""
          for name in CYT_KEYSTORE_B64 CYT_KEYSTORE_PASSWORD CYT_KEY_ALIAS CYT_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::missing or empty secret(s):$missing"
            exit 1
          fi
          echo "all four signing secrets are present and non-empty"
      - name: Reconstruct the signing keystore (this job only; never logged)
        env:
          CYT_KEYSTORE_B64: ${{ secrets.CYT_KEYSTORE_B64 }}
        run: |
          umask 077
          printf '%s' "$CYT_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cyt-personal.p12"
          echo "CYT_KEYSTORE_PATH=$RUNNER_TEMP/cyt-personal.p12" >> "$GITHUB_ENV"
      - name: Unit tests, lint and release build (personally signed)
        working-directory: launcher
        env:
          CYT_KEYSTORE_PASSWORD: ${{ secrets.CYT_KEYSTORE_PASSWORD }}
          CYT_KEY_ALIAS: ${{ secrets.CYT_KEY_ALIAS }}
          CYT_KEY_PASSWORD: ${{ secrets.CYT_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: Verify the signer (exactly one, pinned certificate SHA-256)
        run: |
          APK=launcher/app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner"
          OUT=$("$APKSIGNER" verify --verbose --print-certs "$APK")
          echo "$OUT"
          count=$(echo "$OUT" | grep -c '^Signer #[0-9]* certificate SHA-256 digest:')
          test "$count" -eq 1 || { echo "::error::expected exactly one signer, found $count"; exit 1; }
          digest=$(echo "$OUT" | grep '^Signer #1 certificate SHA-256 digest:' | awk '{print $NF}' | tr 'A-Z:' 'a-z')
          expected="a3ddf8fed5d9a5f55cdc8cba700e0cffbc23f9c61ad9f0d724dfbb9482402da0"
          test "$digest" = "$expected" || { echo "::error::signing certificate mismatch: got $digest"; exit 1; }
          echo "apksigner: exactly one signer, certificate matches the pinned fingerprint"
      - name: The launcher stays under the personal 1 MiB gate
        run: |
          size=$(stat -c %s launcher/app/build/outputs/apk/release/app-release.apk)
          echo "release APK: $((size / 1024)) KB"
          test "$size" -lt 1048576 || { echo "APK is over the personal fork's 1 MiB cap"; exit 1; }
      - name: Upload the personally-signed release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: launcher-release-apk-signed
          path: launcher/app/build/outputs/apk/release/app-release.apk
          retention-days: 1
      - name: Remove the reconstructed keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/cyt-personal.p12"
